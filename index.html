<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Campus Guide</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <!-- ================= NCL MARKER ================= -->
    <a-marker id="marker1" type="pattern" url="markers/ncl.patt">

      <a-image id="img1" src="assets/ncl.jpg"
        position="-0.9 0.4 0" rotation="-90 0 0"
        width="1.2" height="0.7" class="clickable">
      </a-image>

      <a-text id="text1"
        position="0.3 0.35 0.1" rotation="-90 0 0"
        color="white" width="2.6"
        visible="false" opacity="0"
        material="depthTest: false">
      </a-text>

    </a-marker>

    <!-- ================= LIBRARY MARKER ================= -->
    <a-marker id="marker2" type="pattern" url="markers/library.patt">

      <a-image id="img2" src="assets/library.jpg"
        position="-0.9 0.4 0" rotation="-90 0 0"
        width="1.2" height="0.7" class="clickable">
      </a-image>

      <a-text id="text2"
        position="0.3 0.35 0.1" rotation="-90 0 0"
        color="white" width="2.6"
        visible="false" opacity="0"
        material="depthTest: false">
      </a-text>

    </a-marker>

     <!-- ================= DJAC MARKER ================= -->
    <a-marker id="marker3" type="pattern" url="markers/djac.patt">

      <a-image id="img3" src="assets/djac.jpg"
        position="-0.9 0.4 0" rotation="-90 0 0"
        width="1.2" height="0.7" class="clickable">
      </a-image>

      <a-text id="text3"
        position="0.3 0.35 0.1" rotation="-90 0 0"
        color="white" width="2.6"
        visible="false" opacity="0"
        material="depthTest: false">
      </a-text>
</a-marker>

      <!-- ================= OAT MARKER ================= -->
    <a-marker id="marker4" type="pattern" url="markers/oat.patt">

      <a-image id="img4" src="assets/oat.jpg"
        position="-0.9 0.4 0" rotation="-90 0 0"
        width="1.2" height="0.7" class="clickable">
      </a-image>

      <a-text id="text4"
        position="0.3 0.35 0.1" rotation="-90 0 0"
        color="white" width="2.6"
        visible="false" opacity="0"
        material="depthTest: false">
      </a-text>

    </a-marker>

    <!-- ================= FACULTY BUILDING MARKER ================= -->
    <a-marker id="marker5" type="pattern" url="markers/faculty.patt">

      <a-image id="img5" src="assets/faculty.jpg"
        position="-0.9 0.4 0" rotation="-90 0 0"
        width="1.2" height="0.7" class="clickable">
      </a-image>

      <a-text id="text5"
        position="0.3 0.35 0.1" rotation="-90 0 0"
        color="white" width="2.6"
        visible="false" opacity="0"
        material="depthTest: false">
      </a-text>

    </a-marker>

    <!-- ================= LECTURE HALL COMPLEX MARKER ================= -->
    <a-marker id="marker6" type="pattern" url="markers/lhc.patt">

      <a-image id="img6" src="assets/lhc.jpg"
        position="-0.9 0.4 0" rotation="-90 0 0"
        width="1.2" height="0.7" class="clickable">
      </a-image>

      <a-text id="text6"
        position="0.3 0.35 0.1" rotation="-90 0 0"
        color="white" width="2.6"
        visible="false" opacity="0"
        material="depthTest: false">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- BUTTON -->
  <button id="moreInfoBtn"
    style="
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 12px 20px;
      font-size: 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      display: none;
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 10;">
    More Info
  </button>

  <!-- AUDIO -->
  <audio id="audio1" src="assets/ncl.mp3"></audio>
  <audio id="audio2" src="assets/library.mp3"></audio>
  <audio id="audio3" src="assets/djac.mp3"></audio>
  <audio id="audio4" src="assets/oat.mp3"></audio>
  <audio id="audio5" src="assets/faculty.mp3"></audio>
  <audio id="audio6" src="assets/lhc.mp3"></audio>

  <script>
    const scene = document.querySelector('a-scene');

    scene.addEventListener('loaded', () => {

      const btn = document.querySelector('#moreInfoBtn');

      // ======== NCL ========
      setupMarker(
        '#img1', '#text1', '#marker1', '#audio1',
        'New Core Lab\n\nNCL is a It is a major academic facility designed primarily for undergraduate experiments across several departments.'
      );

      // ======== LIBRARY ========
      setupMarker(
        '#img2', '#text2', '#marker2', '#audio2',
        'P.K. Kelkar Library\n\nIt is the academic hub housing over 300,000 books and volumes and subscribes to more than 1000 periodicals.'
      );

       // ======== DJAC ========
      setupMarker(
        '#img3', '#text3', '#marker3', '#audio3',
        'Diamond Jubilee Academic Complex\n\nThe largest academic building on the IITK Campus, housing several major departments and centers including the Department of Design.'
      );

      // ======== OAT ========
      setupMarker(
        '#img4', '#text4', '#marker4', '#audio4',
        'Open Air Theatre\n\nThe primary hub for the institute s cultural life, located within the New Student Activity Centre(SAC).'
      );

      // ======== FACULTY BUILDING ========
      setupMarker(
        '#img5', '#text5', '#marker5', '#audio5',
        'Faculty Building\n\nOne of the oldest and most central landmarks on campus, serving as a primary hub for academic administration and faculty offices.'
      );

      // ======== LHC ========
      setupMarker(
        '#img6', '#text6', '#marker6', '#audio6',
        'Lecture Hall Complex\n\nCentral academic hub consisting of 20 halls(labelled L1 to L20).'
      );

      function setupMarker(imgId, textId, markerId, audioId, description) {
        const image = document.querySelector(imgId);
        const text  = document.querySelector(textId);
        const marker = document.querySelector(markerId);
        const audio = document.querySelector(audioId);

        let isOpen = false;

        image.addEventListener('click', () => {

          if (!isOpen) {
            text.setAttribute('value', description);
            text.setAttribute('visible', true);

            text.setAttribute('position', '0.3 0.25 0.1');
            text.setAttribute('opacity', 0);

            text.setAttribute('animation__fade',
              'property: opacity; from: 0; to: 1; dur: 500');

            text.setAttribute('animation__move',
              'property: position; from: 0.3 0.25 0.1; to: 0.3 0.4 0.1; dur: 500');

            btn.style.display = 'block';
            setTimeout(() => {
              btn.style.opacity = '1';
              btn.style.transform = 'translateX(-50%) translateY(0)';
            }, 200);

            audio.currentTime = 0;
            audio.play();

            isOpen = true;

          } else {

            text.setAttribute('visible', false);

            btn.style.opacity = '0';
            btn.style.transform = 'translateX(-50%) translateY(20px)';

            setTimeout(() => {
              btn.style.display = 'none';
            }, 400);

            audio.pause();
            audio.currentTime = 0;

            isOpen = false;
          }

        });

        marker.addEventListener('markerLost', () => {
          text.setAttribute('visible', false);

          btn.style.display = 'none';

          audio.pause();
          audio.currentTime = 0;

          isOpen = false;
        });
      }

      // BUTTON CLICK (same for all)
      btn.addEventListener('click', () => {
        window.open('https://www.iitk.ac.in', '_blank');
      });

    });
  </script>

</body>
</html>
